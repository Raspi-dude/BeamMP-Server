name: Alpine Linux Build

on:
  push:
    branches: [ master, minor ]
  pull_request:
    branches: [ master, minor ]
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build BeamMP-Server in Alpine
      run: |
        # Create a Dockerfile for the build
        cat > Dockerfile.alpine-build << 'EOF'
        FROM alpine:latest
        
        # Install build dependencies
        RUN apk add --no-cache \
            git \
            cmake \
            make \
            g++ \
            curl \
            zip \
            unzip \
            tar \
            lua5.3-dev \
            bash \
            pkgconf \
            ninja \
            linux-headers
        
        WORKDIR /build
        
        # Copy source
        COPY . .
        
        # Clone vcpkg with full history (not shallow)
        RUN rm -rf vcpkg && \
            git clone https://github.com/microsoft/vcpkg.git vcpkg && \
            cd vcpkg && \
            git checkout 6353ece09f6cebc34413ea04e69beab3fece73c2
        
        # Configure with CMake
        RUN cmake -S . -B bin -DCMAKE_BUILD_TYPE=Release
        
        # Build
        RUN cmake --build bin --config Release -t BeamMP-Server
        
        EOF
        
        # Build using Docker
        docker build -f Dockerfile.alpine-build -t beammp-builder .
        
        # Extract the binary
        docker create --name beammp-extract beammp-builder
        docker cp beammp-extract:/build/bin/BeamMP-Server ./BeamMP-Server
        docker rm beammp-extract
    
    - name: Verify binary
      run: |
        ls -lh BeamMP-Server
        file BeamMP-Server
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BeamMP-Server-Alpine
        path: BeamMP-Server
        retention-days: 30

  # Optional: Create a release
  release:
    needs: build-alpine
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: BeamMP-Server-Alpine
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: BeamMP-Server
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
