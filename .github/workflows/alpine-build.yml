name: Alpine Linux Build (Multi-Arch)

on:
  push:
    branches: [ master, minor ]
  pull_request:
    branches: [ master, minor ]
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_name: x64
          - platform: linux/arm64
            arch_name: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Required for building ARM images on x64 runners
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build BeamMP-Server in Alpine
      run: |
        # Create a Dockerfile for the build
        cat > Dockerfile.alpine-build << 'EOF'
        FROM alpine:latest
        
        # Install ALL build dependencies
        RUN apk add --no-cache \
            git cmake make g++ gcc musl-dev curl wget zip unzip tar \
            lua5.3-dev bash pkgconf samurai linux-headers perl python3 \
            autoconf automake libtool file
        
        WORKDIR /build
        
        # Copy source
        COPY . .
        
        # Set environment variables for vcpkg
        ENV VCPKG_FORCE_SYSTEM_BINARIES=1
        
        # Update vcpkg submodule
        RUN git submodule update --init --recursive && \
            cd vcpkg && \
            git fetch --unshallow || true && \
            ./bootstrap-vcpkg.sh -disableMetrics
        
        # Configure with CMake
        RUN cmake -S . -B bin \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DCMAKE_CXX_FLAGS="-Wno-error=template-body -static-libgcc -static-libstdc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
        
        # Build
        RUN cmake --build bin --config Release -t BeamMP-Server
        EOF
        
        # Build using Docker Buildx with specific platform
        # --load brings the image back to the local Docker daemon for extraction
        docker buildx build \
          --platform ${{ matrix.platform }} \
          -f Dockerfile.alpine-build \
          -t beammp-builder \
          --load .
        
        # Extract the binary
        docker create --name beammp-extract beammp-builder
        docker cp beammp-extract:/build/bin/BeamMP-Server ./BeamMP-Server
        docker rm beammp-extract

    - name: Rename and Verify Binary
      run: |
        # Rename binary to include architecture
        mv BeamMP-Server BeamMP-Server-alpine-${{ matrix.arch_name }}
        
        ls -lh BeamMP-Server-alpine-${{ matrix.arch_name }}
        file BeamMP-Server-alpine-${{ matrix.arch_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BeamMP-Server-alpine-${{ matrix.arch_name }}
        path: BeamMP-Server-alpine-${{ matrix.arch_name }}
        retention-days: 30

  # Optional: Create a release
  release:
    needs: build-alpine
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        # Matches both artifacts (x64 and arm64)
        pattern: BeamMP-Server-alpine-*
        merge-multiple: true
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: BeamMP-Server-alpine-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
