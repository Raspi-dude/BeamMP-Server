name: Alpine Linux Build

on:
  push:
    branches: [ master, minor ]
  pull_request:
    branches: [ master, minor ]
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build in Alpine Docker container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          alpine:latest \
          /bin/sh -c "
            apk add --no-cache git cmake make g++ curl zip unzip tar lua5.3-dev bash pkgconf ninja &&
            cmake -S . -B bin -DCMAKE_BUILD_TYPE=Release &&
            cmake --build bin --config Release -t BeamMP-Server
          "
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BeamMP-Server-Alpine
        path: bin/BeamMP-Server
        retention-days: 30

  # Optional: Create a release
  release:
    needs: build-alpine
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: BeamMP-Server-Alpine
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: BeamMP-Server
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
